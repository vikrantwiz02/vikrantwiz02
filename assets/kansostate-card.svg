<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">KansoState</title>
  <desc id="desc">Real-time meeting intelligence built with Go, Next.js, FastAPI, and WebRTC.</desc>
