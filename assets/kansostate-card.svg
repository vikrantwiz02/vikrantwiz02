  <text x="28" y="108" fill="#bbb5c8" font-family="Arial, sans-serif" font-size="14">Consensus intelligence for live meetings.</text>
  <text x="28" y="130" fill="#817b8f" font-family="Arial, sans-serif" font-size="12">Group video · transcription · speaker drift · intent graphs</text>
