  <circle cx="400" cy="400" r="224" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="5 15"/>
  <circle cx="400" cy="400" r="168" fill="#0d0b15" stroke="url(#accent)" stroke-width="8"/>
  <circle cx="400" cy="400" r="190" fill="none" stroke="#ec4899" stroke-opacity="0.12" stroke-width="28"/>
  <path d="M400 113V205 M605 195L540 260 M687 400H595 M605 605L540 540 M400 687V595 M195 605L260 540 M113 400H205 M195 195L260 260" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="3"/>
  <g fill="#08070d" stroke-width="5">
