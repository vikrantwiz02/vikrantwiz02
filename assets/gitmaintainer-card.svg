  <rect x="1" y="1" width="578" height="238" rx="20" fill="url(#glow)"/>
  <text x="28" y="39" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">04 / DEVELOPER EXPERIENCE</text>
  <text x="28" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="1">GITMAINTAINER</text>
  <text x="28" y="108" fill="#bbb5c8" font-family="Arial, sans-serif" font-size="14">A priority inbox for maintainers.</text>
  <text x="28" y="130" fill="#817b8f" font-family="Arial, sans-serif" font-size="12">Ranks every issue and pull request needing attention</text>
