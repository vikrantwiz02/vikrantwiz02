<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">GitMaintainer</title>
  <desc id="desc">A priority inbox for GitHub maintainers built with TypeScript and React.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(480 105) rotate(135) scale(190)"><stop stop-color="#db2777" stop-opacity="0.2"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="578" height="238" rx="20" fill="#0b0911" stroke="#ffffff" stroke-opacity="0.12"/>
