<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Vikrant Kumar — Full-Stack Software Engineer</title>
  <desc id="desc">Profile banner highlighting production platforms, digital health, and real-time systems.</desc>
  <defs>
